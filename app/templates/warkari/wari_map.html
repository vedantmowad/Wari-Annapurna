<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wari Map | Wari Annapurna</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #FFF8EE;
            font-family: Arial, sans-serif;
            color: #3f2a20;
        }

        .topbar {
            background: linear-gradient(135deg, #A84300, #D97706);
            color: white;
            padding: 16px 25px;
            box-shadow: 0 4px 15px rgba(107, 61, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h4 {
            margin: 0;
            font-weight: 700;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .page-container {
            padding: 25px;
        }

        .map-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #F3E2CB;
            box-shadow: 0 10px 28px rgba(107, 61, 0, 0.08);
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .map-header h5 {
            font-weight: 700;
            margin: 0;
        }

        .centre-count {
            background: #FFF1E3;
            color: #A84300;
            padding: 7px 13px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
        }

        #wariMap {
            width: 100%;
            height: 650px;
            border-radius: 16px;
            overflow: hidden;
        }

        .leaflet-popup-content {
            font-size: 14px;
            min-width: 210px;
        }
