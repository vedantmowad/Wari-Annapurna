<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Annadan Centres | Wari Annapurna</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff8f1;
            color: #3f2a20;
            font-family: Inter, Arial, sans-serif;
        }

        .navbar-custom {
            background: linear-gradient(135deg, #e85d04, #f48c06);
            padding: 16px 0;
            box-shadow: 0 4px 18px rgba(232, 93, 4, 0.18);
        }

        .brand {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: .2px;
        }

        .brand i {
            margin-right: 8px;
        }

        .page-wrapper {
            padding: 40px 0 60px;
        }

        .hero {
            background: linear-gradient(135deg, #fff1df, #fffaf5);
            border: 1px solid #ffd7ad;
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            right: -60px;
            top: -70px;
            background: rgba(244, 140, 6, 0.10);
            border-radius: 50%;
        }

        .hero h1 {
            font-size: 32px;
            font-weight: 800;
            color: #c2410c;
            margin-bottom: 8px;
        }

        .hero p {
            color: #795548;
            margin: 0;
            font-size: 15px;
        }

        .filter-card {
            background: white;
            border: 1px solid #f2dcc7;
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 8px 25px rgba(90, 45, 10, 0.06);
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 700;
            color: #5d4037;
            font-size: 14px;
        }

        .form-control,
        .form-select {
            border-radius: 12px;
            border: 1px solid #e6cbb5;
            padding: 11px 14px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #f48c06;
            box-shadow: 0 0 0 3px rgba(244, 140, 6, 0.12);
        }
        
        .btn-wari {
            background: linear-gradient(135deg, #e85d04, #f48c06);
            border: none;
            color: white;
            border-radius: 12px;
            font-weight: 700;
            padding: 11px 18px;
        }

        .btn-wari:hover {
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(232, 93, 4, 0.25);
        }

        .btn-reset {
            border: 1px solid #d8c2b0;
            color: #6d4c41;
            background: white;
            border-radius: 12px;
            font-weight: 600;
            padding: 11px 18px;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .section-heading h4 {
            font-weight: 800;
            margin: 0;
            color: #4e342e;
        }

        .service-count {
            background: #fff0df;
            color: #d35400;
            border-radius: 50px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 700;
        }

        .service-card {
            height: 100%;
            background: white;
            border: 1px solid #f0d8c2;
            border-radius: 20px;
            padding: 22px;
            transition: all .25s ease;
            box-shadow: 0 8px 25px rgba(90, 45, 10, 0.06);
        }

        .service-card:hover {
            transform: translateY(-5px);
            border-color: #f4a261;
            box-shadow: 0 14px 32px rgba(90, 45, 10, 0.12);
        }

        .service-title {
            color: #4e342e;
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .location {
            color: #8d6e63;
            font-size: 13px;
        }

        .available-badge {
            background: #e8f7ed;
            color: #238b45;
            border-radius: 50px;
            padding: 7px 11px;
            font-size: 11px;
            font-weight: 700;
        }

        .meal-badge {
            background: #fff0df;
            color: #d35400;
            border-radius: 50px;
            padding: 7px 12px;
            font-weight: 700;
            font-size: 12px;
        }

        .availability-label {
            color: #8d6e63;
            font-size: 12px;
            margin-bottom: 2px;
        }
