<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Annadan Centres | Wari Annapurna</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fff8f1;
            color: #3f2a20;
            font-family: Inter, Arial, sans-serif;
        }

        .navbar-custom {
            background: linear-gradient(135deg, #e85d04, #f48c06);
            padding: 16px 0;
            box-shadow: 0 4px 18px rgba(232, 93, 4, 0.18);
        }

        .brand {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: .2px;
        }

        .brand i {
            margin-right: 8px;
        }

        .page-wrapper {
            padding: 40px 0 60px;
        }

                .hero {
            background: linear-gradient(135deg, #fff1df, #fffaf5);
            border: 1px solid #ffd7ad;
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            right: -60px;
            top: -70px;
            background: rgba(244, 140, 6, 0.10);
            border-radius: 50%;
        }

        .hero h1 {
            font-size: 32px;
            font-weight: 800;
            color: #c2410c;
            margin-bottom: 8px;
        }

        .hero p {
            color: #795548;
            margin: 0;
            font-size: 15px;
        }
