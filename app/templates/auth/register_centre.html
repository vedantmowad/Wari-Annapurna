<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Annadan Centre | Wari Annapurna</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --saffron:#e67e22;
    --deep-saffron:#c65d0e;
    --orange-light:#fff3e6;
    --dark:#2d241f;
}

*{box-sizing:border-box}

body{
    font-family:'Open Sans',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 15px;
    background:
    linear-gradient(135deg,rgba(104,48,9,.94),rgba(226,111,24,.88)),
    url('https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&q=85')
    center/cover;
}

.auth-wrapper{
    width:100%;
    max-width:520px;
}

.brand{
    text-align:center;
    margin-bottom:22px;
    color:white;
}

.brand h4{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    margin-bottom:5px;
}

.brand-icon{
    color:#ffd166;
}

.brand small{
    color:rgba(255,255,255,.85);
}

.register-card{
    background:rgba(255,255,255,.98);
    border-radius:24px;
    padding:42px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.register-icon{
    width:70px;
    height:70px;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--orange-light);
    color:var(--saffron);
    font-size:2rem;
}

.register-card h3{
    font-family:'Poppins',sans-serif;
    color:var(--dark);
}

.subtitle{
    color:#777;
    font-size:.95rem;
}

.form-label{
    font-weight:600;
    color:#40362f;
    margin-bottom:8px;
}

.input-group-text{
    background:#fff;
    border:1px solid #dee2e6;
    border-right:none;
    color:var(--saffron);
    border-radius:12px 0 0 12px;
}

.form-control,.form-select{
    border-radius:12px;
    padding:12px 14px;
    box-shadow:none!important;
}

.input-group .form-control{
    border-left:none;
    border-radius:0 12px 12px 0;
}

.form-control:focus,.form-select:focus{
    border-color:var(--saffron);
    box-shadow:0 0 0 .15rem rgba(230,126,34,.12)!important;
}

.input-group:focus-within .input-group-text{
    border-color:var(--saffron);
}

.location-box{
    background:var(--orange-light);
    border-radius:15px;
    padding:18px;
}

.location-box h6{
    font-weight:700;
}

.location-box i{
    color:var(--saffron);
}

.btn-location{
    border-radius:50px;
}

.btn-register{
    background:linear-gradient(135deg,var(--deep-saffron),var(--saffron));
    color:white;
    font-weight:700;
    border:none;
    border-radius:50px;
    padding:13px;
    transition:.3s ease;
}

.btn-register:hover{
    color:white;
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(198,93,14,.35);
}

.login-link{
    color:var(--deep-saffron);
    font-weight:700;
    text-decoration:none;
}

.login-link:hover{
    color:var(--saffron);
    text-decoration:underline;
}

.seva-message{
    text-align:center;
    color:rgba(255,255,255,.85);
    font-size:.85rem;
    margin-top:20px;
}

.seva-message i{
    color:#ffd166;
}

@media(max-width:480px){
    .register-card{
        padding:30px 22px;
    }
}
</style>
</head>

<body>

<div class="auth-wrapper">

<div class="brand">
    <h4>
        <i class="bi bi-flower1 brand-icon me-2"></i>
        Wari Annapurna
    </h4>
    <small>
        <i class="bi bi-arrow-left me-1"></i>
        Annadan Centre Registration
    </small>
</div>

<div class="register-card">

<div class="register-icon">
    <i class="bi bi-shop"></i>
</div>

<h3 class="fw-bold text-center mb-2">Register Annadan Centre</h3>

<p class="subtitle text-center mb-4">
    Register your food centre and serve the Warkari community
</p>

<form method="POST">

<div class="mb-3">
    <label class="form-label">Centre Name</label>
    <div class="input-group">
        <span class="input-group-text">
            <i class="bi bi-shop"></i>
        </span>
        <input
            type="text"
            name="centre_name"
            class="form-control"
            placeholder="Enter Annadan centre name"
            required
        >
    </div>
</div>

<div class="mb-3">
    <label class="form-label">Address</label>
    <textarea
        name="address"
        class="form-control"
        rows="3"
        placeholder="Enter complete centre address"
        required
    ></textarea>
</div>

<div class="row g-3 mb-3">

<div class="col-md-6">
    <label class="form-label">City</label>
    <div class="input-group">
        <span class="input-group-text">
            <i class="bi bi-building"></i>
        </span>
        <input
            type="text"
            name="city"
            class="form-control"
            placeholder="City"
            required
        >
    </div>
</div>

<div class="col-md-6">
    <label class="form-label">Contact Phone</label>
    <div class="input-group">
        <span class="input-group-text">
            <i class="bi bi-telephone"></i>
        </span>
        <input
            type="tel"
            name="contact_phone"
            class="form-control"
            placeholder="Phone number"
            required
        >
    </div>
</div>

</div>

<div class="location-box mb-3">

<h6>
    <i class="bi bi-geo-alt-fill me-2"></i>
    Centre Location
</h6>

<p class="text-muted small mb-3">
    Add the exact location so Warkaris can find your centre.
</p>

<div class="row g-3">

<div class="col-md-6">
    <label class="form-label">Latitude</label>
    <input
        type="number"
        step="any"
        id="latitude"
        name="latitude"
        class="form-control"
        placeholder="Latitude"
        required
    >
</div>

<div class="col-md-6">
    <label class="form-label">Longitude</label>
    <input
        type="number"
        step="any"
        id="longitude"
        name="longitude"
        class="form-control"
        placeholder="Longitude"
        required
    >
</div>

</div>

<button
    type="button"
    class="btn btn-outline-warning btn-sm btn-location mt-3"
    onclick="getLocation()"
>
    <i class="bi bi-crosshair me-1"></i>
    Use Current Location
</button>

</div>

<button type="submit" class="btn btn-register w-100 mt-2">
    <i class="bi bi-heart-fill me-2"></i>
    Register Annadan Centre
</button>

</form>

<p class="text-center text-muted mt-4 mb-0">
    Already registered?
    <a href="/login" class="login-link">Login</a>
</p>

</div>

<div class="seva-message">
    <i class="bi bi-heart-fill me-1"></i>
    Serve with Seva. Help ensure no Warkari goes hungry.
</div>

</div>

<script>
function getLocation(){
    if(!navigator.geolocation){
        alert("Geolocation is not supported by your browser.");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        position=>{
            document.getElementById("latitude").value=
                position.coords.latitude.toFixed(7);

            document.getElementById("longitude").value=
                position.coords.longitude.toFixed(7);
        },
        ()=>{
            alert("Location access denied. Please enter the location manually.");
        }
    );
}
</script>

</body>
</html>
