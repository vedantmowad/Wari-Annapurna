<title>Login | Wari Annapurna</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

    :root {
        --saffron: #e67e22;
        --deep-saffron: #c65d0e;
        --orange-light: #fff3e6;
        --dark: #2d241f;
    }

    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Open Sans', sans-serif;

        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 30px 15px;

        background:
            linear-gradient(
                135deg,
                rgba(104, 48, 9, 0.94),
                rgba(226, 111, 24, 0.88)
            ),
            url('https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&q=85')
            center/cover;

        position: relative;
        overflow-x: hidden;
    }

    /* Decorative background elements */

    body::before {
        content: "";
        position: absolute;

        width: 300px;
        height: 300px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.06);

        top: -100px;
        left: -100px;
    }

    body::after {
        content: "";
        position: absolute;

        width: 350px;
        height: 350px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.05);

        bottom: -150px;
        right: -100px;
    }

    .auth-wrapper {
        width: 100%;
        max-width: 430px;

        position: relative;
        z-index: 2;
    }

    /* =========================
       BRAND
    ========================= */

    .brand {
        text-align: center;
        margin-bottom: 22px;
        color: white;
        cursor: pointer;
    }

    .brand-icon {
        color: #ffd166;
    }

    .brand h4 {
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
        margin-bottom: 5px;
    }

    .brand small {
        color: rgba(255, 255, 255, 0.85);
    }

    .back-arrow {
        margin-right: 5px;
    }

    /* =========================
       LOGIN CARD
    ========================= */

    .login-card {
        background: rgba(255, 255, 255, 0.98);

        border-radius: 24px;

        padding: 42px;

        box-shadow:
            0 25px 70px rgba(0, 0, 0, 0.25);

        animation: fadeUp 0.8s ease;

        border: 1px solid rgba(255, 255, 255, 0.5);
    }

    @keyframes fadeUp {

        from {
            opacity: 0;
            transform: translateY(35px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }

    }

    .login-icon {
        width: 70px;
        height: 70px;

        margin: 0 auto 20px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: var(--orange-light);

        color: var(--saffron);

        font-size: 2rem;
    }

    .login-card h3 {
        font-family: 'Poppins', sans-serif;
        color: var(--dark);
    }

    .subtitle {
        color: #777;
        font-size: 0.95rem;
    }

    /* =========================
       FORM
    ========================= */

    .form-label {
        font-weight: 600;
        color: #40362f;
        margin-bottom: 8px;
    }

    .input-group-text {
        background: #fff;
        border: 1px solid #dee2e6;
        border-right: none;

        color: var(--saffron);

        border-radius: 12px 0 0 12px;
    }

    .form-control {
        border-radius: 0 12px 12px 0;

        padding: 12px 14px;

        border-left: none;

        box-shadow: none !important;
    }

    .form-control:focus {
        border-color: var(--saffron);
    }

    .input-group:focus-within .input-group-text {
        border-color: var(--saffron);
    }

    /* =========================
       LOGIN BUTTON
    ========================= */

    .btn-login {
        background: linear-gradient(
            135deg,
            var(--deep-saffron),
            var(--saffron)
        );

        color: white;

        font-weight: 700;

        border: none;

        border-radius: 50px;

        padding: 13px;

        transition: all 0.3s ease;
    }

    .btn-login:hover {
        color: white;

        transform: translateY(-2px);

        box-shadow:
            0 10px 25px rgba(198, 93, 14, 0.35);
    }

    /* =========================
       REGISTER LINK
    ========================= */

    .register-link {
        color: var(--deep-saffron);
        font-weight: 700;
        text-decoration: none;
    }

    .register-link:hover {
        color: var(--saffron);
        text-decoration: underline;
    }

    /* =========================
       FOOTER MESSAGE
    ========================= */

    .seva-message {
        text-align: center;

        color: rgba(255, 255, 255, 0.85);

        font-size: 0.85rem;

        margin-top: 20px;
    }

    .seva-message i {
        color: #ffd166;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 480px) {

        .login-card {
            padding: 30px 22px;
        }

        .brand h4 {
            font-size: 1.2rem;
        }

    }

</style>
```

<!-- =========================
     BRAND / BACK TO HOME
========================= -->

<div class="brand"
     onclick="window.location.href='/'">

    <h4>
        <i class="bi bi-flower1 brand-icon me-2"></i>
        Wari Annapurna
    </h4>

    <small>
        <i class="bi bi-arrow-left back-arrow"></i>
        Back to Home
    </small>

</div>

<!-- =========================
     LOGIN CARD
========================= -->

<div class="login-card">

    <!-- LOGIN ICON -->

    <div class="login-icon">

        <i class="bi bi-person-heart"></i>

    </div>


    <!-- HEADING -->

    <h3 class="fw-bold text-center mb-2">

        Welcome Back 🙏

    </h3>


    <p class="subtitle text-center mb-4">

        Login to continue your Seva journey

    </p>


    <!-- =========================
         LOGIN FORM

         IMPORTANT:
         method="POST" is preserved
         name="email" is preserved
         name="password" is preserved

         This keeps compatibility with
         the existing Flask backend.
    ========================= -->

    <form method="POST">


        <!-- EMAIL -->

        <div class="mb-3">

            <label class="form-label">
                Email Address
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-envelope"></i>
                </span>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>

        </div>


        <!-- PASSWORD -->

        <div class="mb-3">

            <label class="form-label">
                Password
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="btn btn-login w-100 mt-3">

            <i class="bi bi-box-arrow-in-right me-2"></i>

            Login to Wari Annapurna

        </button>

    </form>


    <!-- REGISTER -->

    <p class="text-center text-muted mt-4 mb-0">

        New to Wari Annapurna?

        <a href="/register"
           class="register-link">

            Create an account

        </a>

    </p>

</div>
