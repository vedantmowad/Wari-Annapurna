<title>Register | Wari Annapurna</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

    :root {
        --saffron: #e67e22;
        --deep-saffron: #c65d0e;
        --orange-light: #fff3e6;
        --dark: #2d241f;
    }

    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Open Sans', sans-serif;

        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 30px 15px;

        background:
            linear-gradient(
                135deg,
                rgba(104, 48, 9, 0.94),
                rgba(226, 111, 24, 0.88)
            ),
            url('https://images.unsplash.com/photo-1515003197210-e0cd71810b5f?auto=format&fit=crop&q=85')
            center/cover;

        position: relative;
        overflow-x: hidden;
    }

    /* Decorative background circles */

    body::before {
        content: "";

        position: absolute;

        width: 300px;
        height: 300px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.06);

        top: -100px;
        left: -100px;
    }

    body::after {
        content: "";

        position: absolute;

        width: 350px;
        height: 350px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.05);

        bottom: -150px;
        right: -100px;
    }

    .auth-wrapper {
        width: 100%;
        max-width: 480px;

        position: relative;
        z-index: 2;
    }

    /* =========================
       BRAND
    ========================= */

    .brand {
        text-align: center;

        margin-bottom: 22px;

        color: white;

        cursor: pointer;
    }

    .brand h4 {
        font-family: 'Poppins', sans-serif;

        font-weight: 700;

        margin-bottom: 5px;
    }

    .brand-icon {
        color: #ffd166;
    }

    .brand small {
        color: rgba(255, 255, 255, 0.85);
    }

    /* =========================
       REGISTER CARD
    ========================= */

    .register-card {
        background: rgba(255, 255, 255, 0.98);

        border-radius: 24px;

        padding: 42px;

        box-shadow:
            0 25px 70px rgba(0, 0, 0, 0.25);

        animation: fadeUp 0.8s ease;

        border: 1px solid rgba(255, 255, 255, 0.5);
    }

    @keyframes fadeUp {

        from {
            opacity: 0;
            transform: translateY(35px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }

    }

    /* =========================
       REGISTER ICON
    ========================= */

    .register-icon {
        width: 70px;
        height: 70px;

        margin: 0 auto 20px;

        display: flex;

        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: var(--orange-light);

        color: var(--saffron);

        font-size: 2rem;
    }

    .register-card h3 {
        font-family: 'Poppins', sans-serif;

        color: var(--dark);
    }

    .subtitle {
        color: #777;

        font-size: 0.95rem;
    }

    /* =========================
       FORM
    ========================= */

    .form-label {
        font-weight: 600;

        color: #40362f;

        margin-bottom: 8px;
    }

    .input-group-text {
        background: #fff;

        border: 1px solid #dee2e6;

        border-right: none;

        color: var(--saffron);

        border-radius: 12px 0 0 12px;
    }

    .form-control,
    .form-select {

        border-radius: 12px;

        padding: 12px 14px;

        box-shadow: none !important;
    }

    .input-group .form-control {

        border-left: none;

        border-radius: 0 12px 12px 0;

    }

    .form-control:focus,
    .form-select:focus {

        border-color: var(--saffron);

        box-shadow:
            0 0 0 0.15rem rgba(230, 126, 34, 0.12) !important;

    }

    .input-group:focus-within .input-group-text {

        border-color: var(--saffron);

    }

    /* =========================
       ROLE SELECT
    ========================= */

    .role-info {

        background: var(--orange-light);

        border-radius: 12px;

        padding: 12px 15px;

        margin-top: 8px;

        color: #79502f;

        font-size: 0.82rem;

    }

    .role-info i {

        color: var(--saffron);

    }

    /* =========================
       REGISTER BUTTON
    ========================= */

    .btn-register {

        background: linear-gradient(
            135deg,
            var(--deep-saffron),
            var(--saffron)
        );

        color: white;

        font-weight: 700;

        border: none;

        border-radius: 50px;

        padding: 13px;

        transition: all 0.3s ease;

    }

    .btn-register:hover {

        color: white;

        transform: translateY(-2px);

        box-shadow:
            0 10px 25px rgba(198, 93, 14, 0.35);

    }

    /* =========================
       LOGIN LINK
    ========================= */

    .login-link {

        color: var(--deep-saffron);

        font-weight: 700;

        text-decoration: none;

    }

    .login-link:hover {

        color: var(--saffron);

        text-decoration: underline;

    }

    /* =========================
       SEVA MESSAGE
    ========================= */

    .seva-message {

        text-align: center;

        color: rgba(255, 255, 255, 0.85);

        font-size: 0.85rem;

        margin-top: 20px;

    }

    .seva-message i {

        color: #ffd166;

    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 480px) {

        .register-card {

            padding: 30px 22px;

        }

        .brand h4 {

            font-size: 1.2rem;

        }

    }

</style>
