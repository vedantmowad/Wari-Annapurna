<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: #f6f7f9;
            font-family: Arial, sans-serif;
        }

        .header {
            background: linear-gradient(135deg, #ff7a00, #ff9f43);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .header h2 {
            margin: 0;
            font-weight: 700;
        }

        .header p {
            margin: 5px 0 0;
        }

        .card-box,
        .chart-box,
        .filter-box,
        .table-box {
            background: white;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .card-box {
            padding: 20px;
            height: 100%;
        }

        .stat-title {
            color: #777;
            font-size: 14px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            margin: 5px 0;
        }

        .filter-box {
            padding: 20px;
            margin-bottom: 25px;
        }

        .chart-box {
            padding: 20px;
            margin-bottom: 25px;
        }

        .chart-box h5,
        .table-box h5 {
            font-weight: 600;
            margin-bottom: 20px;
        }

        .chart-area {
            height: 300px;
        }

        .table-box {
            padding: 20px;
        }

        .orange-btn {
            background: #ff7a00;
            color: white;
            border: none;
        }

        .orange-btn:hover {
            background: #e96d00;
            color: white;
        }

        .status-available {
            background: #d1fae5;
            color: #047857;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .status-other {
            background: #fff3cd;
            color: #856404;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
    </style>
