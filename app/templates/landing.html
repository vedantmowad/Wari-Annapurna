<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wari Annapurna | Smart Annadan & Crowd Mobility Platform</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --saffron: #e87516;
            --deep: #8f3f08;
            --orange: #ff9f32;
            --gold: #ffd166;
            --cream: #fff8ef;
            --dark: #24170f;
            --muted: #74675d;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, .12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: var(--cream);
            color: var(--dark);
            overflow-x: hidden;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Poppins', sans-serif;
        }

        a {
            text-decoration: none;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #6d2b05, #e87516);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            transition: opacity .7s ease, visibility .7s ease;
        }

        #loader.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loader-flag {
            font-size: 4rem;
            animation: loaderFloat 1.2s infinite alternate;
        }

        .loader-title {
            margin-top: 15px;
            font-family: 'Poppins';
            font-weight: 800;
            font-size: 1.7rem;
        }

        .loader-line {
            width: 160px;
            height: 4px;
            background: rgba(255, 255, 255, .25);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .loader-line span {
            display: block;
            height: 100%;
            width: 40%;
            background: #ffd166;
            animation: loaderLine 1.2s infinite;
        }

        @keyframes loaderFloat {
            from {
                transform: translateY(0) rotate(-3deg);
            }

            to {
                transform: translateY(-12px) rotate(3deg);
            }
        }

        @keyframes loaderLine {
            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(300%);
            }
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 2000;
            padding: 18px 0;
            transition: .4s ease;
        }

        .navbar.scrolled {
            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(18px);
            box-shadow: 0 8px 30px rgba(50, 25, 5, .1);
            padding: 10px 0;
        }

        .navbar-brand {
            color: white !important;
            font-family: 'Poppins';
            font-weight: 800;
            font-size: 1.4rem;
        }

        .navbar.scrolled .navbar-brand {
            color: var(--dark) !important;
        }

        .brand-icon {
            color: #ff9800;
        }

        .nav-link {
            color: rgba(255, 255, 255, .88) !important;
            font-weight: 600;
            margin: 0 5px;
            transition: .3s;
        }

        .navbar.scrolled .nav-link {
            color: var(--dark) !important;
        }

        .nav-link:hover {
            color: #ffd166 !important;
            transform: translateY(-2px);
        }

        .nav-login {
            border: 1px solid rgba(255, 255, 255, .7);
            color: white;
            border-radius: 50px;
            padding: 9px 22px;
        }

        .navbar.scrolled .nav-login {
            border-color: var(--saffron);
            color: var(--deep);
        }

        .nav-join {
            background: white;
            color: var(--deep);
            border-radius: 50px;
            padding: 10px 22px;
            font-weight: 700;
            transition: .3s;
        }

        .nav-join:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
        }

        .hero {
            min-height: 850px;
            position: relative;
            overflow: hidden;
            color: white;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg,
                rgba(60, 25, 5, .65),
                rgba(130, 55, 10, .45),
                rgba(220, 110, 20, .25)),
            url("{{ url_for('static', filename='wari-background.png') }}");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            clip-path: polygon(0 0,
                    100% 0,
                    100% 91%,
                    75% 96%,
                    50% 100%,
                    25% 96%,
                    0 91%);
        }
