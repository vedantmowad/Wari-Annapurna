<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wari Annapurna | Smart Annadan & Crowd Mobility Platform</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --saffron: #e87516;
            --deep: #8f3f08;
            --orange: #ff9f32;
            --gold: #ffd166;
            --cream: #fff8ef;
            --dark: #24170f;
            --muted: #74675d;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, .12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: var(--cream);
            color: var(--dark);
            overflow-x: hidden;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Poppins', sans-serif;
        }

        a {
            text-decoration: none;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #6d2b05, #e87516);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            transition: opacity .7s ease, visibility .7s ease;
        }

        #loader.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loader-flag {
            font-size: 4rem;
            animation: loaderFloat 1.2s infinite alternate;
        }

        .loader-title {
            margin-top: 15px;
            font-family: 'Poppins';
            font-weight: 800;
            font-size: 1.7rem;
        }

        .loader-line {
            width: 160px;
            height: 4px;
            background: rgba(255, 255, 255, .25);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .loader-line span {
            display: block;
            height: 100%;
            width: 40%;
            background: #ffd166;
            animation: loaderLine 1.2s infinite;
        }

        @keyframes loaderFloat {
            from {
                transform: translateY(0) rotate(-3deg);
            }

            to {
                transform: translateY(-12px) rotate(3deg);
            }
        }

        @keyframes loaderLine {
            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(300%);
            }
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 2000;
            padding: 18px 0;
            transition: .4s ease;
        }

        .navbar.scrolled {
            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(18px);
            box-shadow: 0 8px 30px rgba(50, 25, 5, .1);
            padding: 10px 0;
        }

        .navbar-brand {
            color: white !important;
            font-family: 'Poppins';
            font-weight: 800;
            font-size: 1.4rem;
        }

        .navbar.scrolled .navbar-brand {
            color: var(--dark) !important;
        }

        .brand-icon {
            color: #ff9800;
        }

        .nav-link {
            color: rgba(255, 255, 255, .88) !important;
            font-weight: 600;
            margin: 0 5px;
            transition: .3s;
        }

        .navbar.scrolled .nav-link {
            color: var(--dark) !important;
        }

        .nav-link:hover {
            color: #ffd166 !important;
            transform: translateY(-2px);
        }

        .nav-login {
            border: 1px solid rgba(255, 255, 255, .7);
            color: white;
            border-radius: 50px;
            padding: 9px 22px;
        }

        .navbar.scrolled .nav-login {
            border-color: var(--saffron);
            color: var(--deep);
        }

        .nav-join {
            background: white;
            color: var(--deep);
            border-radius: 50px;
            padding: 10px 22px;
            font-weight: 700;
            transition: .3s;
        }

        .nav-join:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
        }

        .hero {
            min-height: 850px;
            position: relative;
            overflow: hidden;
            color: white;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg,
                rgba(60, 25, 5, .65),
                rgba(130, 55, 10, .45),
                rgba(220, 110, 20, .25)),
            url("{{ url_for('static', filename='wari-background.png') }}");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            clip-path: polygon(0 0,
                    100% 0,
                    100% 91%,
                    75% 96%,
                    50% 100%,
                    25% 96%,
                    0 91%);
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            right: -250px;
            top: 70px;
            border: 1px solid rgba(255, 255, 255, .12);
            box-shadow:
                0 0 0 80px rgba(255, 255, 255, .025),
                0 0 0 160px rgba(255, 255, 255, .02);
        }

        .hero-grid {
            position: absolute;
            inset: 0;
            opacity: .07;
            background-image:
                linear-gradient(rgba(255, 255, 255, .4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .4) 1px, transparent 1px);
            background-size: 70px 70px;
            mask-image: linear-gradient(to bottom, black, transparent);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 20;
            padding: 150px 0 180px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, .35);
            background: rgba(255, 255, 255, .11);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            font-weight: 700;
            animation: badgeGlow 3s infinite;
        }

        @keyframes badgeGlow {

            0%,
            100% {
                box-shadow: 0 0 0 rgba(255, 209, 102, 0);
            }

            50% {
                box-shadow: 0 0 30px rgba(255, 209, 102, .15);
            }
        }

        .hero h1 {
            font-size: clamp(3rem, 6vw, 5.5rem);
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: -3px;
            margin-top: 25px;
        }

        .hero h1 span {
            color: #ffd166;
            position: relative;
        }

        .hero h1 span::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -7px;
            height: 4px;
            background: #ffd166;
            border-radius: 10px;
            transform: scaleX(0);
            transform-origin: left;
            animation: underline 1.5s 1s forwards;
        }

        @keyframes underline {
            to {
                transform: scaleX(1);
            }
        }

        .hero-description {
            max-width: 780px;
            margin: 30px auto;
            font-size: 1.15rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, .9);
            text-shadow: 0 2px 10px rgba(0, 0, 0, .3);
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-main {
            background: white;
            color: var(--deep);
            border: 2px solid white;
            border-radius: 50px;
            padding: 14px 30px;
            font-weight: 800;
            transition: .35s;
        }

        .btn-main:hover {
            color: white;
            background: transparent;
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, .2);
        }

        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, .8);
            border-radius: 50px;
            padding: 14px 30px;
            font-weight: 800;
            transition: .35s;
        }

        .btn-secondary:hover {
            background: white;
            color: var(--deep);
            transform: translateY(-5px);
        }

        .wari-particle {
            position: absolute;
            color: rgba(255, 209, 102, .6);
            font-size: 1.4rem;
            animation: particleFloat linear infinite;
            z-index: 2;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            85% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .wari-visual {
            position: absolute;
            right: 4%;
            bottom: 50px;
            width: min(510px, 42vw);
            z-index: 8;
            transition: transform .2s ease-out;
        }

        .palkhi-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 209, 102, .18);
            filter: blur(70px);
            border-radius: 50%;
            top: 20%;
            left: 20%;
        }

        .palkhi {
            position: relative;
            animation: palkhiFloat 4s ease-in-out infinite;
        }

        @keyframes palkhiFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        .palkhi-roof {
            width: 210px;
            height: 70px;
            background: linear-gradient(135deg, #ffd166, #f49a1c);
            margin: auto;
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, .2));
        }

        .palkhi-top {
            width: 35px;
            height: 55px;
            background: #ffd166;
            margin: auto;
            border-radius: 5px 5px 0 0;
            position: relative;
        }

        .palkhi-top::after {
            content: "🚩";
            position: absolute;
            font-size: 50px;
            left: 5px;
            top: -55px;
            animation: flagWave 2s infinite;
        }

        @keyframes flagWave {

            0%,
            100% {
                transform: rotate(-5deg);
            }

            50% {
                transform: rotate(7deg);
            }
        }

        .palkhi-body {
            width: 250px;
            height: 130px;
            margin: auto;
            background: linear-gradient(135deg, #fff3ce, #f6bf58);
            border: 6px solid #d87912;
            border-radius: 8px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, .22);
            position: relative;
        }

        .palkhi-body::before {
            content: "॥ श्री विठ्ठल ॥";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins';
            font-weight: 800;
            color: #8d3e08;
            font-size: 1.1rem;
        }

        .palkhi-wheel {
            position: absolute;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #733008;
            border: 7px solid #f7a52d;
            bottom: -30px;
        }

        .wheel-left {
            left: 25%;
        }

        .wheel-right {
            right: 25%;
        }

        .route-line {
            width: 500px;
            height: 100px;
            border-bottom: 3px dashed rgba(255, 209, 102, .55);
            border-radius: 50%;
            margin: 10px auto 0;
            position: relative;
        }

        .route-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffd166;
            box-shadow: 0 0 20px #ffd166;
            animation: routeMove 3s infinite linear;
        }

        @keyframes routeMove {
            from {
                left: 0;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            to {
                left: 100%;
                opacity: 0;
            }
        }

        .warkari-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 25px;
            font-size: 2.2rem;
            filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .2));
        }

        .warkari-row span {
            display: inline-block;
            animation: walk 1.3s infinite alternate;
        }

        .warkari-row span:nth-child(2) {
            animation-delay: .15s;
        }

        .warkari-row span:nth-child(3) {
            animation-delay: .3s;
        }

        .warkari-row span:nth-child(4) {
            animation-delay: .45s;
        }

        .warkari-row span:nth-child(5) {
            animation-delay: .6s;
        }

        @keyframes walk {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-8px);
            }
        }
