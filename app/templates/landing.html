<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wari Annapurna | Smart Annadan & Crowd Mobility Platform</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --saffron: #e87516;
            --deep: #8f3f08;
            --orange: #ff9f32;
            --gold: #ffd166;
            --cream: #fff8ef;
            --dark: #24170f;
            --muted: #74675d;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, .12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: var(--cream);
            color: var(--dark);
            overflow-x: hidden;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Poppins', sans-serif;
        }

        a {
            text-decoration: none;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #6d2b05, #e87516);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
            transition: opacity .7s ease, visibility .7s ease;
        }

        #loader.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loader-flag {
            font-size: 4rem;
            animation: loaderFloat 1.2s infinite alternate;
        }

        .loader-title {
            margin-top: 15px;
            font-family: 'Poppins';
            font-weight: 800;
            font-size: 1.7rem;
        }

        .loader-line {
            width: 160px;
            height: 4px;
            background: rgba(255, 255, 255, .25);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .loader-line span {
            display: block;
            height: 100%;
            width: 40%;
            background: #ffd166;
            animation: loaderLine 1.2s infinite;
        }

        @keyframes loaderFloat {
            from {
                transform: translateY(0) rotate(-3deg);
            }

            to {
                transform: translateY(-12px) rotate(3deg);
            }
        }

        @keyframes loaderLine {
            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(300%);
            }
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 2000;
            padding: 18px 0;
            transition: .4s ease;
        }

        .navbar.scrolled {
            background: rgba(255, 255, 255, .94);
            backdrop-filter: blur(18px);
            box-shadow: 0 8px 30px rgba(50, 25, 5, .1);
            padding: 10px 0;
        }

        .navbar-brand {
            color: white !important;
            font-family: 'Poppins';
            font-weight: 800;
            font-size: 1.4rem;
        }

        .navbar.scrolled .navbar-brand {
            color: var(--dark) !important;
        }

        .brand-icon {
            color: #ff9800;
        }

        .nav-link {
            color: rgba(255, 255, 255, .88) !important;
            font-weight: 600;
            margin: 0 5px;
            transition: .3s;
        }

        .navbar.scrolled .nav-link {
            color: var(--dark) !important;
        }

        .nav-link:hover {
            color: #ffd166 !important;
            transform: translateY(-2px);
        }

        .nav-login {
            border: 1px solid rgba(255, 255, 255, .7);
            color: white;
            border-radius: 50px;
            padding: 9px 22px;
        }

        .navbar.scrolled .nav-login {
            border-color: var(--saffron);
            color: var(--deep);
        }

        .nav-join {
            background: white;
            color: var(--deep);
            border-radius: 50px;
            padding: 10px 22px;
            font-weight: 700;
            transition: .3s;
        }

        .nav-join:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);
        }

        .hero {
            min-height: 850px;
            position: relative;
            overflow: hidden;
            color: white;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg,
                rgba(60, 25, 5, .65),
                rgba(130, 55, 10, .45),
                rgba(220, 110, 20, .25)),
            url("{{ url_for('static', filename='wari-background.png') }}");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            clip-path: polygon(0 0,
                    100% 0,
                    100% 91%,
                    75% 96%,
                    50% 100%,
                    25% 96%,
                    0 91%);
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            right: -250px;
            top: 70px;
            border: 1px solid rgba(255, 255, 255, .12);
            box-shadow:
                0 0 0 80px rgba(255, 255, 255, .025),
                0 0 0 160px rgba(255, 255, 255, .02);
        }

        .hero-grid {
            position: absolute;
            inset: 0;
            opacity: .07;
            background-image:
                linear-gradient(rgba(255, 255, 255, .4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .4) 1px, transparent 1px);
            background-size: 70px 70px;
            mask-image: linear-gradient(to bottom, black, transparent);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 20;
            padding: 150px 0 180px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, .35);
            background: rgba(255, 255, 255, .11);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            font-weight: 700;
            animation: badgeGlow 3s infinite;
        }

        @keyframes badgeGlow {

            0%,
            100% {
                box-shadow: 0 0 0 rgba(255, 209, 102, 0);
            }

            50% {
                box-shadow: 0 0 30px rgba(255, 209, 102, .15);
            }
        }

        .hero h1 {
            font-size: clamp(3rem, 6vw, 5.5rem);
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: -3px;
            margin-top: 25px;
        }

        .hero h1 span {
            color: #ffd166;
            position: relative;
        }

        .hero h1 span::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -7px;
            height: 4px;
            background: #ffd166;
            border-radius: 10px;
            transform: scaleX(0);
            transform-origin: left;
            animation: underline 1.5s 1s forwards;
        }

        @keyframes underline {
            to {
                transform: scaleX(1);
            }
        }

        .hero-description {
            max-width: 780px;
            margin: 30px auto;
            font-size: 1.15rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, .9);
            text-shadow: 0 2px 10px rgba(0, 0, 0, .3);
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-main {
            background: white;
            color: var(--deep);
            border: 2px solid white;
            border-radius: 50px;
            padding: 14px 30px;
            font-weight: 800;
            transition: .35s;
        }

        .btn-main:hover {
            color: white;
            background: transparent;
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, .2);
        }

        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, .8);
            border-radius: 50px;
            padding: 14px 30px;
            font-weight: 800;
            transition: .35s;
        }

        .btn-secondary:hover {
            background: white;
            color: var(--deep);
            transform: translateY(-5px);
        }

        .wari-particle {
            position: absolute;
            color: rgba(255, 209, 102, .6);
            font-size: 1.4rem;
            animation: particleFloat linear infinite;
            z-index: 2;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            85% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .wari-visual {
            position: absolute;
            right: 4%;
            bottom: 50px;
            width: min(510px, 42vw);
            z-index: 8;
            transition: transform .2s ease-out;
        }

        .palkhi-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 209, 102, .18);
            filter: blur(70px);
            border-radius: 50%;
            top: 20%;
            left: 20%;
        }

        .palkhi {
            position: relative;
            animation: palkhiFloat 4s ease-in-out infinite;
        }

        @keyframes palkhiFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        .palkhi-roof {
            width: 210px;
            height: 70px;
            background: linear-gradient(135deg, #ffd166, #f49a1c);
            margin: auto;
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, .2));
        }

        .palkhi-top {
            width: 35px;
            height: 55px;
            background: #ffd166;
            margin: auto;
            border-radius: 5px 5px 0 0;
            position: relative;
        }

        .palkhi-top::after {
            content: "🚩";
            position: absolute;
            font-size: 50px;
            left: 5px;
            top: -55px;
            animation: flagWave 2s infinite;
        }

        @keyframes flagWave {

            0%,
            100% {
                transform: rotate(-5deg);
            }

            50% {
                transform: rotate(7deg);
            }
        }

        .palkhi-body {
            width: 250px;
            height: 130px;
            margin: auto;
            background: linear-gradient(135deg, #fff3ce, #f6bf58);
            border: 6px solid #d87912;
            border-radius: 8px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, .22);
            position: relative;
        }

        .palkhi-body::before {
            content: "॥ श्री विठ्ठल ॥";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins';
            font-weight: 800;
            color: #8d3e08;
            font-size: 1.1rem;
        }

        .palkhi-wheel {
            position: absolute;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #733008;
            border: 7px solid #f7a52d;
            bottom: -30px;
        }

        .wheel-left {
            left: 25%;
        }

        .wheel-right {
            right: 25%;
        }

        .route-line {
            width: 500px;
            height: 100px;
            border-bottom: 3px dashed rgba(255, 209, 102, .55);
            border-radius: 50%;
            margin: 10px auto 0;
            position: relative;
        }

        .route-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffd166;
            box-shadow: 0 0 20px #ffd166;
            animation: routeMove 3s infinite linear;
        }

        @keyframes routeMove {
            from {
                left: 0;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            to {
                left: 100%;
                opacity: 0;
            }
        }

        .warkari-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 25px;
            font-size: 2.2rem;
            filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .2));
        }

        .warkari-row span {
            display: inline-block;
            animation: walk 1.3s infinite alternate;
        }

        .warkari-row span:nth-child(2) {
            animation-delay: .15s;
        }

        .warkari-row span:nth-child(3) {
            animation-delay: .3s;
        }

        .warkari-row span:nth-child(4) {
            animation-delay: .45s;
        }

        .warkari-row span:nth-child(5) {
            animation-delay: .6s;
        }

        @keyframes walk {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-8px);
            }
        }

        .live-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 30px;
            padding: 9px 16px;
            border-radius: 50px;
            background: rgba(0, 0, 0, .25);
            border: 1px solid rgba(255, 255, 255, .18);
            backdrop-filter: blur(8px);
            font-size: .9rem;
        }

        .live-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #59ff91;
            box-shadow: 0 0 0 0 rgba(89, 255, 145, .7);
            animation: livePulse 1.6s infinite;
        }

        @keyframes livePulse {
            70% {
                box-shadow: 0 0 0 10px rgba(89, 255, 145, 0);
            }
        }

        .impact-section {
            margin-top: -90px;
            position: relative;
            z-index: 30;
        }

        .impact-card {
            background: white;
            border-radius: 24px;
            padding: 30px 20px;
            height: 100%;
            text-align: center;
            border: 1px solid rgba(230, 126, 34, .1);
            box-shadow: 0 18px 45px rgba(61, 30, 8, .1);
            transition: .4s;
            transform-style: preserve-3d;
        }

        .impact-card:hover {
            transform: translateY(-12px) rotateX(3deg) rotateY(-3deg);
            box-shadow: 0 25px 60px rgba(61, 30, 8, .15);
        }

        .impact-icon {
            width: 65px;
            height: 65px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--cream);
            color: var(--saffron);
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .counter {
            font-size: 2.1rem;
            font-weight: 800;
            font-family: 'Poppins';
        }

        .section {
            padding: 110px 0;
        }

        .section-label {
            color: var(--saffron);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: .8rem;
            font-weight: 800;
        }

        .section-title {
            font-size: clamp(2rem, 4vw, 3.2rem);
            font-weight: 800;
            margin-top: 8px;
        }

        .section-description {
            max-width: 680px;
            margin: 15px auto;
            color: var(--muted);
            line-height: 1.8;
        }

        .mobility-section {
            background: #fff;
            overflow: hidden;
        }

        .mobility-dashboard {
            background: linear-gradient(145deg, #351707, #713009);
            border-radius: 30px;
            padding: 35px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 70px rgba(65, 30, 5, .2);
        }

        .mobility-dashboard::before {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(255, 160, 45, .12);
            right: -150px;
            top: -150px;
        }

        .map-area {
            height: 330px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 22px;
            background:
                linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px);
            background-size: 40px 40px;
            overflow: hidden;
        }

        .wari-road {
            position: absolute;
            width: 80%;
            height: 100px;
            border-top: 4px dashed rgba(255, 209, 102, .55);
            border-radius: 50%;
            transform: rotate(-10deg);
            left: 10%;
            top: 42%;
        }

        .centre-marker {
            position: absolute;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffb02e;
            border: 4px solid white;
            box-shadow: 0 0 0 12px rgba(255, 176, 46, .15);
        }

        .marker-one {
            left: 15%;
            top: 51%;
        }

        .marker-two {
            left: 46%;
            top: 42%;
        }

        .marker-three {
            right: 15%;
            top: 33%;
        }

        .crowd {
            position: absolute;
            font-size: 1.2rem;
            animation: crowdMove 5s infinite linear;
        }

        .c1 {
            left: 15%;
            top: 55%;
            animation-delay: 0s;
        }

        .c2 {
            left: 22%;
            top: 52%;
            animation-delay: .8s;
        }

        .c3 {
            left: 30%;
            top: 48%;
            animation-delay: 1.6s;
        }

        .c4 {
            left: 38%;
            top: 45%;
            animation-delay: 2.4s;
        }

        .c5 {
            left: 47%;
            top: 41%;
            animation-delay: 3.2s;
        }

        @keyframes crowdMove {
            from {
                transform: translateX(-20px);
                opacity: .2;
            }

            15% {
                opacity: 1;
            }

            85% {
                opacity: 1;
            }

            to {
                transform: translateX(90px);
                opacity: .2;
            }
        }

        .mobility-stat {
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .1);
            padding: 18px;
            border-radius: 18px;
        }

        .mobility-stat small {
            color: rgba(255, 255, 255, .6);
        }

        .mobility-number {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .process-card {
            padding: 35px 25px;
            height: 100%;
            border-radius: 24px;
            background: white;
            border: 1px solid #f1dfcd;
            transition: .4s;
            position: relative;
            overflow: hidden;
        }

        .process-card::before {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--cream);
            top: -40px;
            right: -40px;
        }

        .process-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(60, 30, 10, .1);
        }

        .process-number {
            font-size: 4rem;
            font-weight: 800;
            color: rgba(230, 126, 34, .08);
            position: absolute;
            top: 5px;
            right: 20px;
        }

        .process-icon {
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            background: var(--cream);
            color: var(--saffron);
            font-size: 2rem;
            margin-bottom: 22px;
            position: relative;
        }

        .process-card h4 {
            font-weight: 800;
        }

        .process-card p {
            color: var(--muted);
            line-height: 1.7;
        }

        .features-section {
            background: linear-gradient(180deg, #fff8ef, #fff);
        }

        .feature-card {
            background: white;
            border: 1px solid rgba(230, 126, 34, .12);
            border-radius: 22px;
            padding: 28px;
            height: 100%;
            transition: .4s;
            position: relative;
            overflow: hidden;
        }

        .feature-card::after {
            content: "";
            position: absolute;
            width: 0;
            height: 4px;
            bottom: 0;
            left: 0;
            background: var(--saffron);
            transition: .4s;
        }

        .feature-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 45px rgba(50, 25, 5, .09);
        }

        .feature-card:hover::after {
            width: 100%;
        }

        .feature-icon {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--cream);
            color: var(--saffron);
            border-radius: 16px;
            font-size: 1.5rem;
            margin-bottom: 18px;
        }

        .feature-card h5 {
            font-weight: 800;
        }

        .feature-card p {
            color: var(--muted);
            line-height: 1.7;
            margin: 0;
        }

        .journey {
            position: relative;
        }

        .journey-line {
            position: absolute;
            top: 42px;
            left: 15%;
            right: 15%;
            height: 3px;
            background: linear-gradient(90deg, var(--saffron), #ffd166, var(--saffron));
        }

        .journey-item {
            position: relative;
            text-align: center;
        }

        .journey-circle {
            width: 85px;
            height: 85px;
            background: white;
            border: 5px solid var(--saffron);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 1.8rem;
            color: var(--saffron);
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 30px rgba(80, 35, 5, .12);
            transition: .4s;
        }

        .journey-item:hover .journey-circle {
            transform: scale(1.15) rotate(8deg);
            background: var(--saffron);
            color: white;
        }

        .journey-item h5 {
            margin-top: 18px;
            font-weight: 800;
        }

        .journey-item p {
            color: var(--muted);
            font-size: .9rem;
        }

        .trust-box {
            background: linear-gradient(135deg, #fff1dd, #fff);
            border: 1px solid #f1dbc2;
            border-radius: 30px;
            padding: 55px;
        }

        .trust-item {
            background: white;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            height: 100%;
            box-shadow: 0 7px 22px rgba(50, 25, 5, .05);
            transition: .3s;
        }

        .trust-item:hover {
            transform: translateX(5px);
        }

        .trust-item i {
            color: var(--saffron);
            font-size: 1.6rem;
        }

        .cta {
            padding: 110px 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 209, 102, .18), transparent 25%),
                radial-gradient(circle at 80% 70%, rgba(255, 209, 102, .12), transparent 25%),
                linear-gradient(135deg, #7e3507, #e87516);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .cta::before {

        footer {

        }

            color: #ffd166;
            transform: translateX(5px);

            width: 40px;
            height: 40px;

            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            margin-right: 7px;
            transition: .3s;
        }

        .social:hover {
            background: var(--saffron);
            border-color: var(--saffron);
            transform: translateY(-4px);
        }

        .footer-bottom {
            color: #827870;
        }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: 1s ease;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);

        #topBtn {
            position: fixed;
            right: 25px;
            bottom: 25px;

            height: 48px;
            border: none;
            border-radius: 50%;
            background: var(--saffron);
            color: white;
            z-index: 1500;
            opacity: 0;
            visibility: hidden;
            transition: .3s;
            box-shadow: 0 8px 25px rgba(100, 40, 5, .25);
        }

        #topBtn.show {
            opacity: 1;
            visibility: visible;
        }

        #topBtn:hover {
            transform: translateY(-4px);
